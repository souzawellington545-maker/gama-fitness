<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>gama-fitness - Gestão de Academia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#121212;--sf:#1e1e1e;--ink:#f3f4f6;--mut:#9ca3af;--ln:#2d2d2d;--ac:#f97316;--ac-ink:#fff}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Archivo,system-ui,sans-serif}
nav{width:220px;background:var(--sf);border-right:1px solid var(--ln);padding:20px 12px;display:flex;flex-direction:column;gap:4px;height:100vh;position:fixed;top:0;left:0}
.logo{font-weight:800;font-size:22px;padding:10px 10px 16px;letter-spacing:-.5px;color:var(--ac)}
nav a{display:flex;align-items:center;gap:10px;padding:10px;border-radius:8px;color:var(--mut);text-decoration:none;font-weight:600;font-size:14px;transition:.15s}
nav a:hover,nav a.active{background:var(--ln);color:var(--ink)}
nav a.active{color:var(--ac)}
main{margin-left:220px;padding:32px;max-width:1200px}
h1{font-size:26px;font-weight:800;margin:0 0 8px;letter-spacing:-.5px}
.sub{color:var(--mut);font-size:14px;margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:20px;display:flex;flex-direction:column;gap:12px}
.btn{background:var(--ac);color:var(--ac-ink);border:0;padding:10px 16px;border-radius:8px;font-weight:600;cursor:pointer;font-size:14px;transition:.15s}
.btn:hover{opacity:.9}
.btn.sec{background:var(--ln);color:var(--ink)}
</style>
</head>
<body>
<nav id="nav"></nav>
<main id="main">
  <h1>Painel</h1>
  <div class="sub">Carregando painel Gama Fitness...</div>
</main>
<script>
const $=s=>document.querySelector(s);
const ROTAS=[
  ['painel','Painel'],
  ['alunos','Alunos'],
  ['check-in','Check-in'],
  ['aulas','Aulas'],
  ['treinos','Treinos'],
  ['financeiro','Financeiro'],
  ['planos','Planos'],
  ['configuracoes','Configurações']
];
function nav(r){
  $('#nav').innerHTML='<div class="logo">Gama<b>Fitness</b></div>'+ROTAS.map(x=>'<a href="#'+x[0]+'" class="'+(r===x[0]?'active':'')+'">'+x[1]+'</a>').join('');
}
function render(){
  let hash=location.hash.slice(1)||'painel';
  nav(hash);
  if(hash==='aulas'){
    $('#main').innerHTML=`
      <h1>Aulas</h1>
      <div class="sub">Grade semanal e reservas de vagas.</div>
      <button class="btn" onclick="alert('Nova aula')">Nova aula</button>
      <div class="grid" style="margin-top:20px">
        <div class="card">
          <h3>Spinning</h3>
          <div class="sub" style="margin:0">Seg às 07:00</div>
          <button class="btn">Reservar</button>
        </div>
      </div>`;
  } else {
    $('#main').innerHTML=`<h1>Painel</h1><div class="sub">Bem-vindo ao Gama Fitness.</div>`;
  }
}
window.addEventListener('hashchange',render);
window.addEventListener('load',render);
</script>
</body>
</html>
